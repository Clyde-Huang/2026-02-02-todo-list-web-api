<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://upload.cc/i1/2022/03/23/yOW5kv.png"
    />
    <script
      src="https://kit.fontawesome.com/0f3f38a034.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./adjust.css" />
    <title>ToDo List</title>
  </head>

  <body>
    <!-- login_page -->
    <div id="loginPage" class="bg-yellow">
      <div class="conatiner loginPage vhContainer">
        <div class="side">
          <a href="#"
            ><img
              class="logoImg"
              src="https://upload.cc/i1/2022/03/23/rhefZ3.png"
              alt=""
          /></a>
          <img
            class="d-m-n"
            src="https://upload.cc/i1/2022/03/23/tj3Bdk.png"
            alt="workImg"
          />
        </div>
        <div>
          <form class="formControls" id="loginForm">
            <h2 class="formControls_txt">最實用的線上代辦事項服務</h2>
            <label class="formControls_label" for="loginEmail">Email</label>
            <input
              class="formControls_input"
              type="email"
              id="loginEmail"
              placeholder="請輸入 email"
              required
            />
            <span class="error-msg"></span>
            <label class="formControls_label" for="loginPwd">密碼</label>
            <input
              class="formControls_input"
              type="password"
              id="loginPwd"
              placeholder="請輸入密碼"
              required
            />
            <button class="formControls_btnSubmit" type="submit">登入</button>
            <a class="formControls_btnLink" href="#signUpPage">註冊帳號</a>
          </form>
        </div>
      </div>
    </div>

    <!-- sign up -->
    <div id="signUpPage" class="bg-yellow" style="display: none">
      <div class="conatiner signUpPage vhContainer">
        <div class="side">
          <a href="#"
            ><img
              class="logoImg"
              src="https://upload.cc/i1/2022/03/23/rhefZ3.png"
              alt=""
          /></a>
          <img
            class="d-m-n"
            src="https://upload.cc/i1/2022/03/23/tj3Bdk.png"
            alt="workImg"
          />
        </div>
        <div>
          <form class="formControls" id="signUpForm">
            <h2 class="formControls_txt">註冊帳號</h2>
            <label class="formControls_label" for="signUpEmail">Email</label>
            <input
              class="formControls_input"
              type="email"
              id="signUpEmail"
              placeholder="請輸入 email"
              required
            />
            <label class="formControls_label" for="signUpNickname"
              >您的暱稱</label
            >
            <input
              class="formControls_input"
              type="text"
              id="signUpNickname"
              placeholder="請輸入您的暱稱"
            />
            <label class="formControls_label" for="signUpPwd">密碼</label>
            <input
              class="formControls_input"
              type="password"
              id="signUpPwd"
              placeholder="請輸入密碼"
              required
            />
            <label class="formControls_label" for="signUpPwd2"
              >再次輸入密碼</label
            >
            <input
              class="formControls_input"
              type="password"
              id="signUpPwd2"
              placeholder="請再次輸入密碼"
              required
            />
            <button class="formControls_btnSubmit" type="submit">
              註冊帳號
            </button>
            <a class="formControls_btnLink" href="#loginPage">登入</a>
          </form>
        </div>
      </div>
    </div>

    <!-- ToDo List -->
    <div id="todoListPage" class="bg-half" style="display: none">
      <nav>
        <h1><a href="#">ONLINE TODO LIST</a></h1>
        <ul>
          <li class="todo_sm">
            <a href="#"><span id="userName">使用者</span>的代辦</a>
          </li>
          <li><a href="#" id="logoutBtn">登出</a></li>
        </ul>
      </nav>
      <div class="conatiner todoListPage vhContainer">
        <div class="todoList_Content">
          <div class="inputBox">
            <input type="text" id="todoInput" placeholder="請輸入待辦事項" />
            <a href="#" id="addTodoBtn">
              <i class="fa fa-plus"></i>
            </a>
          </div>
          <div class="todoList_list">
            <ul class="todoList_tab">
              <li><a href="#" id="tabAll" class="active">全部</a></li>
              <li><a href="#" id="tabUncompleted">待完成</a></li>
              <li><a href="#" id="tabCompleted">已完成</a></li>
            </ul>
            <div class="todoList_items">
              <ul class="todoList_item" id="todoListContainer">
                <!-- 待辦事項將動態插入這裡 -->
              </ul>
              <div class="todoList_statistics">
                <p id="todoStatistics">0 個已完成項目</p>
                <a href="#" id="clearCompletedBtn">清除已完成項目</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- <script type="module" src="./api.js"></script> -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
